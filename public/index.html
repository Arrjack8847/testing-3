<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d6c3df">
  <meta name="description" content="Celestial Lake — static Royal Lotus Garden opening composition preview">
  <title>Celestial Lake | Static Artwork Preview</title>
  <link rel="stylesheet" href="./scene.css">
</head>
<body>
<main class="preview-shell" aria-label="Celestial Lake static opening review">
  <div class="scene" aria-label="Illustrated royal lotus garden, peacocks, pavilion and lake">
    <div class="layer sky"><img src="./assets/celestial-lake/01_sky.png" alt=""></div>
    <div class="layer mountains"><img src="./assets/celestial-lake/02_mountains.png" alt=""></div>
    <div class="layer water"><img src="./assets/celestial-lake/04_lake.png" alt=""></div>
    <div class="layer shimmer"><img src="./assets/celestial-lake/05_shimmer.png" alt=""></div>
    <div class="layer pavilion"><img src="./assets/celestial-lake/03_pavilion.png" alt=""></div>
    <div class="layer boat"><img src="./assets/celestial-lake/06_boat.png" alt=""></div>
    <div class="layer left-column"><img src="./assets/celestial-lake/14_left_arch_column.png" alt=""></div>
    <div class="layer right-column"><img src="./assets/celestial-lake/15_right_arch_column.png" alt=""></div>
    <!-- Render each composite garden source twice with separate clipping:
         upper framing remains anchored while lower peacocks sit near the lake. -->
    <div class="layer left-garden-upper"><img src="./assets/celestial-lake/07_left_garden.png" alt=""></div>
    <div class="layer right-garden-upper"><img src="./assets/celestial-lake/08_right_garden.png" alt=""></div>
    <div class="layer left-garden-lower"><img src="./assets/celestial-lake/07_left_garden.png" alt=""></div>
    <div class="layer right-garden-lower"><img src="./assets/celestial-lake/08_right_garden.png" alt=""></div>
    <div class="layer left-wisteria"><img src="./assets/celestial-lake/09_left_wisteria.png" alt=""></div>
    <div class="layer right-wisteria"><img src="./assets/celestial-lake/10_right_wisteria.png" alt=""></div>
    <div class="layer center-wisteria"><img src="./assets/celestial-lake/21_center_hanging_wisteria.png" alt=""></div>
    <div class="layer arch-top"><img src="./assets/celestial-lake/13_arch_top_ornament.png" alt=""></div>
    <div class="layer lotus-crest"><img src="./assets/celestial-lake/16_lotus_crest.png" alt=""></div>
    <div class="layer title-divider"><img src="./assets/celestial-lake/17_gold_divider.png" alt=""></div>
    <div class="layer middle-divider"><img src="./assets/celestial-lake/17_gold_divider.png" alt=""></div>
    <div class="layer flowers"><img src="./assets/celestial-lake/19_foreground_flower_cluster.png" alt=""></div>
    <div class="heading-group" aria-label="Wedding heading and reserved couple names area">
      <div class="heading">The Wedding Of</div>
      <div class="names-blank" aria-hidden="true"></div>
    </div>
    <div class="button-position"><div class="button-mockup" aria-label="Open Invitation button visual mockup">Open Invitation</div></div>
  </div>
  <p class="preview-note">Static artwork comparison only · Button is not interactive · No animations or RSVP</p>
</main>
</body>
</html>
